[project]
name = "chumba-labs"
version = "0.1.0"
description = "Autonomous agents for HPLC and GC-MS method development"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.1.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.17",
    "modal>=1.6.2",
    "rdkit>=2026.9.1",
]

[project.scripts]
chumba-labs = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
